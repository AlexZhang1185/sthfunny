
name: Generate and Deploy Static Dashboard
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 仅允许手动触发（页面一键刷新/后台手动运行）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # 主版本标签自动指向最新兼容版本
      - name: Set up Python
        uses: actions/setup-python@v5  # 主版本标签自动指向最新兼容版本
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static data
        run: python generate_static.py
        env:
          TZ: Asia/Shanghai  # 设置时区为中国时间

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          keep_files: true  # 保留 /stairgru/ /sthnew/ 等子路径, 不整盘清空
