name: Realtime Staircase-GRU (stairgru)
on:
  schedule:
    - cron: "*/15 * * * *"      # 每15分钟抓一次当前进行中并生成
  workflow_dispatch:
  push:
    branches: [ stair-gru ]
    paths: [ "strategy/**", ".github/workflows/stairgru.yml" ]
permissions:
  contents: write
concurrency:
  group: stairgru
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install deps
        run: pip install numpy pandas scikit-learn requests joblib "tensorflow-cpu==2.17.0" lxml beautifulsoup4
      - name: Generate realtime predictions
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: "1"
          CURRENT_BUDGET_S: "300"
          PYTHONPATH: "."
        run: python strategy/generate_stairgru_live.py
      - name: Deploy static_stair -> /stairgru/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static_stair
          destination_dir: stairgru
          keep_files: true
          enable_jekyll: false
